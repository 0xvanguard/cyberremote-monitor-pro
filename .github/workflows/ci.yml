name: CI — CyberRemote Monitor Pro

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ───────────────────────────────────────────────────────
  backend:
    name: Backend — Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install CI dependencies only
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv loguru tenacity httpx

      - name: Lint (ruff)
        run: ruff check app/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          if [ -d tests ] && [ "$(ls -A tests)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "⚠️  No tests yet — skipping"
          fi

  # ─── Frontend ───────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint + Type-check + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Check frontend exists
        id: frontend_check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  frontend/package.json not found — skipping frontend job"
          fi

      - name: Install dependencies
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm ci

      - name: Lint (ESLint)
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run lint || true

      - name: Type check
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run type-check || true

  # ─── Security Scan ───────────────────────────────────────────────
  security:
    name: Security — Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t cyberremote-backend:ci ./backend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cyberremote-backend:ci"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
