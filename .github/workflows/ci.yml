name: CI — CyberRemote Monitor Pro

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend ──────────────────────────────────────────────────────────
  backend:
    name: "Backend: Lint + Pruebas"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Verificar que existe backend/
        id: backend_check
        working-directory: .
        run: |
          if [ -d backend ] && [ -f backend/requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  backend/ o requirements.txt no encontrado — skip"
          fi

      - name: Set up Python 3.12
        if: steps.backend_check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Instalar dependencias CI
        if: steps.backend_check.outputs.exists == 'true'
        run: |
          pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio httpx
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv loguru tenacity httpx

      - name: Lint (ruff)
        if: steps.backend_check.outputs.exists == 'true'
        run: ruff check app/ || true

      - name: Type check (mypy)
        if: steps.backend_check.outputs.exists == 'true'
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        if: steps.backend_check.outputs.exists == 'true'
        run: |
          if [ -d tests ] && [ "$(ls -A tests 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "⚠️  Sin tests aún — skip"
          fi

      - name: Skip (backend no encontrado)
        if: steps.backend_check.outputs.exists != 'true'
        run: echo "ℹ️  Job omitido: no existe backend/requirements.txt"

  # ─── Frontend ─────────────────────────────────────────────────────────
  frontend:
    name: "Frontend: Análisis estático de código + Verificación de tipos + Compilación"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verificar que existe frontend/
        id: frontend_check
        working-directory: .
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "exists=true"  >> $GITHUB_OUTPUT
            echo "has_lock=true" >> $GITHUB_OUTPUT
          elif [ -f frontend/package.json ]; then
            echo "exists=true"   >> $GITHUB_OUTPUT
            echo "has_lock=false" >> $GITHUB_OUTPUT
          else
            echo "exists=false"  >> $GITHUB_OUTPUT
            echo "has_lock=false" >> $GITHUB_OUTPUT
            echo "⚠️  frontend/package.json no encontrado — skip"
          fi

      - name: Instalar dependencias (npm ci)
        if: |
          steps.frontend_check.outputs.exists == 'true' &&
          steps.frontend_check.outputs.has_lock == 'true'
        run: npm ci

      - name: Instalar dependencias (npm install)
        if: |
          steps.frontend_check.outputs.exists == 'true' &&
          steps.frontend_check.outputs.has_lock != 'true'
        run: npm install

      - name: Lint (ESLint)
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run lint || true

      - name: Type check
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run type-check || true

      - name: Build
        if: steps.frontend_check.outputs.exists == 'true'
        run: npm run build || true

      - name: Skip (frontend no encontrado)
        if: steps.frontend_check.outputs.exists != 'true'
        run: echo "ℹ️  Job omitido: no existe frontend/package.json"

  # ─── Security Scan ─────────────────────────────────────────────────
  security:
    name: Security — Trivy Container Scan
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Verificar que existe Dockerfile en backend/
        id: docker_check
        working-directory: .
        run: |
          if [ -f backend/Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  backend/Dockerfile no encontrado — skip Trivy"
          fi

      - name: Build backend Docker image
        if: steps.docker_check.outputs.exists == 'true'
        run: docker build -t cyberremote-backend:ci ./backend

      - name: Run Trivy vulnerability scanner
        if: steps.docker_check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cyberremote-backend:ci"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Skip (Dockerfile no encontrado)
        if: steps.docker_check.outputs.exists != 'true'
        run: echo "ℹ️  Job omitido: no existe backend/Dockerfile"
