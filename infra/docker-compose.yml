version: '3.9'

services:
  # ─── Frontend Next.js ───────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_MAPBOX_TOKEN=${MAPBOX_TOKEN}
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  # ─── Backend FastAPI ─────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cyberremote:cyberremote@db:5432/cyberremote
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend:/app

  # ─── Celery Worker (scrapers y alertas) ──────────────────────────
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker worker --loglevel=info --queues=ingest,alerts,analytics
    environment:
      - DATABASE_URL=postgresql+asyncpg://cyberremote:cyberremote@db:5432/cyberremote
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      - db
      - redis
    volumes:
      - ../backend:/app

  # ─── Celery Beat (scheduler) ─────────────────────────────────────
  beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A app.worker beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://cyberremote:cyberremote@db:5432/cyberremote
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  # ─── PostgreSQL + PostGIS ─────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: cyberremote
      POSTGRES_PASSWORD: cyberremote
      POSTGRES_DB: cyberremote
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data/schemas:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberremote"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
