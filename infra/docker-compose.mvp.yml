# ============================================================
# CyberRemote Monitor Pro — MVP (EPIC 1)
# Backend FastAPI + PostgreSQL. Sin Redis/Celery/frontend.
#
#   docker compose -f docker-compose.mvp.yml up --build
#   API:        http://localhost:8000/docs
#   Health:     http://localhost:8000/health
# ============================================================

name: cyberremote-mvp

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://cyberremote:cyberremote@db:5432/cyberremote
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyberremote
      POSTGRES_PASSWORD: cyberremote
      POSTGRES_DB: cyberremote
    volumes:
      - pgdata_mvp:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberremote"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata_mvp:
